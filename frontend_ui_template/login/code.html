<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background h-full flex items-center justify-center font-body-md text-on-background antialiased selection:bg-secondary-container selection:text-on-secondary-container p-gutter">
<!-- Login Card Canvas -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)] border border-surface-variant overflow-hidden p-stack-md md:p-gutter flex flex-col gap-gutter">
<!-- Header -->
<header class="flex flex-col gap-stack-sm items-center text-center">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary">Discourse</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome back. Join the conversation.</p>
</header>
<!-- Form -->
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative flex items-center">
<span aria-hidden="true" class="material-symbols-outlined absolute left-stack-sm text-on-surface-variant pointer-events-none" data-icon="mail">mail</span>
<input class="w-full bg-surface-container-low text-on-surface placeholder:text-on-surface-variant rounded-lg border-none py-[14px] pl-[48px] pr-stack-sm font-body-md text-body-md focus:ring-2 focus:ring-secondary focus:bg-surface-container-lowest transition-colors shadow-sm" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-stack-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:text-secondary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<span aria-hidden="true" class="material-symbols-outlined absolute left-stack-sm text-on-surface-variant pointer-events-none" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-low text-on-surface placeholder:text-on-surface-variant rounded-lg border-none py-[14px] pl-[48px] pr-stack-sm font-body-md text-body-md focus:ring-2 focus:ring-secondary focus:bg-surface-container-lowest transition-colors shadow-sm" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md rounded-full py-[14px] px-stack-md shadow-[0_10px_15px_-3px_rgba(0,0,0,0.1)] active:scale-[0.98] transition-all flex justify-center items-center gap-stack-sm" type="submit">
                Log In
                <span aria-hidden="true" class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer / Secondary Action -->
<footer class="text-center pt-stack-sm border-t border-surface-variant/50">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="text-secondary font-label-md text-label-md hover:underline underline-offset-4 decoration-secondary/50 transition-all" href="#">Register</a>
</p>
</footer>
</main>
<script>
        // Micro-interaction for inputs to add a subtle hover effect if desired, mostly handled by Tailwind focus states.
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.querySelector('.material-symbols-outlined').classList.replace('text-on-surface-variant', 'text-secondary');
            });
            input.addEventListener('blur', function() {
                this.parentElement.querySelector('.material-symbols-outlined').classList.replace('text-secondary', 'text-on-surface-variant');
            });
        });
    </script>
