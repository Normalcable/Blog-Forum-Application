<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="bg-surface-container-lowest dark:bg-surface-dim shadow-sm w-full sticky top-0 z-50 shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)]">
<div class="flex justify-between items-center px-gutter py-stack-sm w-full">
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-variant/50 transition-colors active:scale-95 transition-transform p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">menu</span>
</button>
<div class="font-headline-sm text-headline-sm font-bold text-primary dark:text-inverse-primary">
                Discourse
            </div>
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container-high border border-outline-variant/30 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-secondary">person</span>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center p-margin-mobile pb-32">
<div class="w-full max-w-md">
<div class="text-center mb-stack-md">
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-on-surface mb-stack-sm">Join the Conversation</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create an account to start contributing.</p>
</div>
<!-- Registration Card -->
<div class="bg-surface-container-lowest rounded-xl p-stack-md shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)] border border-outline-variant/30">
<form action="#" class="space-y-stack-md" method="POST">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-unit" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full bg-surface-container-low border-none rounded-lg py-3 pl-10 pr-4 text-on-surface focus:ring-2 focus:ring-secondary focus:bg-white transition-colors font-body-md text-body-md placeholder-outline-variant" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-unit" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full bg-surface-container-low border-none rounded-lg py-3 pl-10 pr-4 text-on-surface focus:ring-2 focus:ring-secondary focus:bg-white transition-colors font-body-md text-body-md placeholder-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary rounded-full py-3 px-6 font-label-md text-label-md font-bold shadow-sm hover:opacity-90 transition-opacity active:scale-[0.98]" type="submit">
                        Register
                    </button>
</form>
<div class="mt-stack-md text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Already have an account? 
                        <a class="text-secondary font-medium hover:underline" href="#">Log in</a>
</p>
</div>
</div>
<!-- Contextual Image (Decorative) -->
<div class="mt-stack-md hidden md:block">
<div class="w-full h-32 rounded-xl bg-cover bg-center opacity-80" data-alt="A soft, abstract geometric pattern in light indigo and slate colors, representing connection and dialogue. Modern, minimalist, bright, vector style illustration suitable for a calm, professional forum application." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD85e7SpSaXIDf1aGqEyuYcJioLrJNKE8tEaprXRlrXn-A1ohLMY1UAKmwIlq2QTY5v3JXrTWWaj-xnuvQ-fwBFGy5xlF2uTHogNVQUKVpZfCGtsWzm2AysftCWinlK5Kyx9-i6DLgQDqursSDkzYAW7YYeqz6oPACxBVz7ROUkx8qDXnuBk2i4EprADHZm6el9tL9nBLGBoArQY-8JxG6KQN9eFdhKrTPnGkkkE7rcFuS4HwIRdIXH')"></div>
